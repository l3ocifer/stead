[workspace]
resolver = "2"
members = [
    "crates/stead-core",
    "crates/stead-capture",
    "crates/stead-ingest",
    "crates/stead-ha",
    "crates/stead-server",
    "crates/stead-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/l3ocifer/stead"
authors = ["Leo Paska"]

[workspace.dependencies]
stead-core = { path = "crates/stead-core" }
stead-capture = { path = "crates/stead-capture" }
stead-ingest = { path = "crates/stead-ingest" }
stead-ha = { path = "crates/stead-ha" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
rumqttc = "0.24"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
