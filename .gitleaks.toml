# Gitleaks config baseline. Extends the default ruleset.
# Add per-repo allowlist entries below; do not weaken the default rules.
#
# A `.gitleaksignore` file may sit alongside this one with fingerprints
# of pre-existing findings; gitleaks honours it automatically (one
# `<file>:<rule>:<line>` entry per line, comments allowed).

[extend]
useDefault = true

[allowlist]
description = "Generic allowlist for documentation, examples, and test fixtures"
paths = [
  '''(?i)\.example($|/)''',
  '''(?i)\.sample($|/)''',
  '''(?i)/fixtures/''',
  '''(?i)/__tests__/.*\.(snap|fixture)\.''',
  '''(?i)/fuzz/corpus/''',
  '''(?i)/sealed-secrets/''',
  '''(?i)\.sealed\.ya?ml$''',
]
regexes = [
  '''(?i)example[_-]?(api[_-]?)?key''',
  '''(?i)dummy[_-]?(secret|token|password)''',
  '''(?i)changeme''',
  '''(?i)REDACTED''',
  '''(?i)<your[_-].+>''',
  '''(?i)<paste[_-].+>''',
  '''(?i)PUT[_-]YOUR[_-]''',
]
