name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: docker
    container:
      image: docker.io/library/rust:1.88
    steps:
      - uses: actions/checkout@v4
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: |
          rustup component add clippy
          cargo clippy --workspace -- -D warnings
      - name: test
        run: cargo test --workspace
